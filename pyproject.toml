[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manimai"
version = "0.1.0"
description = "A library creating animation for AI blocks using manim library"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Vish Sangale", email = "abc@gmail.com"}
]
dependencies = [
    "manim",
    "numpy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["manimai*"]
